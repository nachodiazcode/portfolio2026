<div *ngIf="job" (click)="onClose($event)" class="modal-backdrop">
  <div (click)="stopPropagation($event)" class="modal-content" [class.has-image]="!!job.projectImageUrl || (job.projectImages && job.projectImages.length > 0)">
    
    <!-- Close button -->
    <button (click)="onClose($event)" (mouseenter)="playHover()" aria-label="Cerrar" class="btn-close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>

    <div class="modal-layout-wrapper">
      <div class="modal-info-column">
        <!-- Modal Header -->
        <div style="padding: 32px 32px 24px; border-bottom: 1px solid rgba(255,255,255,.08);">
          <div style="display: flex; align-items: center; gap: 16px; padding-right: 48px;">
            <!-- Initial circle -->
            <div style="flex-shrink: 0; width: 56px; height: 56px; border-radius: 15px; background: linear-gradient(135deg,var(--accent-1),var(--accent-2)); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 23px; font-weight: 800; letter-spacing: -.5px; box-shadow: 0 10px 26px rgba(var(--accent-1-rgb),.35); overflow: hidden;">
              <img *ngIf="job.logoUrl" [src]="job.logoUrl" alt="Logo de {{ job.company }}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 15px;" loading="lazy" decoding="async">
              <span *ngIf="!job.logoUrl">{{ job.company.charAt(0) }}</span>
            </div>
            <div>
              <h3 style="margin: 0 0 4px; font-size: 22px; font-weight: 800; letter-spacing: -.6px; color: #fff;">{{ job.title }}</h3>
              <div style="font-size: 15px; font-weight: 600; background: linear-gradient(120deg,var(--accent-1),var(--accent-mid)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; display: inline-block;">{{ job.company }}</div>
            </div>
          </div>
        </div>

        <!-- Modal Body -->
        <div style="padding: 28px 32px 34px;">
          <div style="display: flex; flex-wrap: wrap; gap: 18px; margin-bottom: 24px; font-size: 13.5px; font-weight: 500; color: var(--text-6);">
            <span style="display: inline-flex; align-items: center; gap: 7px;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
              {{ job.dates }}
            </span>
            <span style="display: inline-flex; align-items: center; gap: 7px;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
              {{ job.duration }}
            </span>
          </div>
          <p style="margin: 0 0 28px; font-size: 16px; line-height: 1.7; color: var(--text-3); text-wrap: pretty;">{{ job.description }}</p>
          
          <!-- Tech Stack -->
          <div style="font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-7); margin-bottom: 12px;">Tech Stack</div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px;">
            <span *ngFor="let t of job.tech" class="tech-pill-modal">{{ t }}</span>
          </div>
        </div>
      </div>

      <!-- Vista previa del Proyecto (Una sola imagen) -->
      <div *ngIf="job.projectImageUrl && (!job.projectImages || job.projectImages.length === 0)" class="modal-image-column">
        <div style="font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-7); margin-bottom: 16px; align-self: flex-start;">
          {{ job.projectLabel || 'Proyecto' }}: {{ job.projectTitle }}
        </div>
        <div class="project-mockup-wrapper">
          <img [src]="job.projectImageUrl" alt="{{ job.projectLabel || 'Proyecto' }} {{ job.projectTitle }}" loading="lazy" decoding="async">
        </div>
      </div>

      <!-- Vista previa del Proyecto (Carrusel) -->
      <div *ngIf="job.projectImages && job.projectImages.length > 0" class="modal-image-column">
        <div style="font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-7); margin-bottom: 16px; align-self: flex-start;">
          {{ job.projectLabel || 'Proyecto' }}: {{ job.projectTitle }}
        </div>
        <div class="project-mockup-wrapper carousel-wrapper" style="position: relative; overflow: hidden; width: 100%;">
          
          <!-- Images -->
          <div style="display: flex; transition: transform 0.4s ease-in-out; height: 100%; align-items: center;"
               [style.transform]="'translateX(-' + currentImageIndex * 100 + '%)'">
            <img *ngFor="let img of job.projectImages" [src]="img" alt="Captura de pantalla del proyecto {{ job.projectTitle }}" 
                 style="width: 100%; flex-shrink: 0; display: block; object-fit: contain; max-height: 380px;" loading="lazy" decoding="async">
          </div>
          
          <!-- Controls -->
          <button (click)="prevImage($event)" class="carousel-btn prev-btn" *ngIf="job.projectImages.length > 1">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <button (click)="nextImage($event)" class="carousel-btn next-btn" *ngIf="job.projectImages.length > 1">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
          
          <!-- Dots -->
          <div class="carousel-dots" *ngIf="job.projectImages.length > 1">
            <div *ngFor="let img of job.projectImages; let i = index" 
                 class="carousel-dot" 
                 [class.active]="i === currentImageIndex"
                 (click)="setCurrentImage(i, $event)">
            </div>
          </div>

        </div>
      </div>
    </div>

  </div>
</div>
