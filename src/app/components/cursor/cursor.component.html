<div #ring class="cursor cursor-ring" aria-hidden="true"><span class="ufo-aura"></span></div>
<div #dot class="cursor cursor-dot" aria-hidden="true">
  <svg class="ufo" viewBox="0 0 64 52" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="ufoDome" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#EED2FF" />
        <stop offset="1" stop-color="var(--accent-1)" />
      </linearGradient>
      <linearGradient id="ufoBeam" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--accent-1)" stop-opacity=".55" />
        <stop offset="1" stop-color="var(--accent-1)" stop-opacity="0" />
      </linearGradient>
    </defs>

    <!-- rayo abductor -->
    <path class="ufo-beam" d="M25 24 L17 50 L47 50 L39 24 Z" fill="url(#ufoBeam)" />
    <!-- disco -->
    <ellipse class="ufo-body" cx="32" cy="22" rx="27" ry="7" />
    <!-- cúpula de vidrio -->
    <path class="ufo-dome" d="M20 20 A12 10 0 0 1 44 20 Z" />
    <!-- brillo de la cúpula -->
    <ellipse class="ufo-glint" cx="27" cy="14" rx="3.4" ry="1.9" />
    <!-- luces del borde (parpadean en secuencia) -->
    <circle class="ufo-light l1" cx="14" cy="23" r="1.8" />
    <circle class="ufo-light l2" cx="23" cy="25" r="1.8" />
    <circle class="ufo-light l3" cx="32" cy="25.5" r="1.8" />
    <circle class="ufo-light l4" cx="41" cy="25" r="1.8" />
    <circle class="ufo-light l5" cx="50" cy="23" r="1.8" />
  </svg>
</div>
