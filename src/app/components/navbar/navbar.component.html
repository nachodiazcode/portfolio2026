<!-- Barra de progreso de lectura -->
<div [style.width]="scrollProgress" style="position: fixed; top: 0; left: 0; height: 2px; background: linear-gradient(90deg,var(--accent-1),var(--accent-2)); z-index: 60; box-shadow: 0 0 12px rgba(var(--accent-1-rgb),.6); transition: width .12s linear;"></div>

<nav class="dock-nav" data-nav [ngClass]="{'shrunk': isShrunk}">
  <div class="dock-container">
    
    <!-- Logo / Nombre -->
    <a [routerLink]="[]" fragment="inicio" class="dock-brand" (mouseenter)="playHover()" (click)="playClick()">
      <div class="brand-avatar">
        <img [src]="photo" [alt]="brandName" />
      </div>
      <span class="brand-name">{{ brandName }}</span>
    </a>

    <!-- Enlaces Principales (Solo Desktop) -->
    <div class="dock-links desktop-only">
      <div class="dock-indicator" aria-hidden="true"></div>
      <a [routerLink]="[]" fragment="inicio" (mouseenter)="playHover()" (click)="goTo('inicio', $event)" [ngClass]="{'active': activeId === 'inicio'}" class="dock-link">Inicio</a>
      <a [routerLink]="[]" fragment="filosofia" (mouseenter)="playHover()" (click)="goTo('filosofia', $event)" [ngClass]="{'active': activeId === 'filosofia'}" class="dock-link">Filosofía</a>
      <a [routerLink]="[]" fragment="sobre-mi" (mouseenter)="playHover()" (click)="goTo('sobre-mi', $event)" [ngClass]="{'active': activeId === 'sobre-mi'}" class="dock-link">Sobre mí</a>
      <a [routerLink]="[]" fragment="stack" (mouseenter)="playHover()" (click)="goTo('stack', $event)" [ngClass]="{'active': activeId === 'stack'}" class="dock-link">Stack</a>
      <a [routerLink]="[]" fragment="proyectos" (mouseenter)="playHover()" (click)="goTo('proyectos', $event)" [ngClass]="{'active': activeId === 'proyectos'}" class="dock-link">Proyectos</a>
      <a [routerLink]="[]" fragment="experiencia" (mouseenter)="playHover()" (click)="goTo('experiencia', $event)" [ngClass]="{'active': activeId === 'experiencia'}" class="dock-link">Experiencia</a>
      <a [routerLink]="[]" fragment="educacion" (mouseenter)="playHover()" (click)="goTo('educacion', $event)" [ngClass]="{'active': activeId === 'educacion'}" class="dock-link">Educación</a>
      <a [routerLink]="[]" fragment="contacto" (mouseenter)="playHover()" (click)="goTo('contacto', $event)" [ngClass]="{'active': activeId === 'contacto'}" class="dock-link">Contacto</a>
    </div>

    <!-- Redes Sociales y Acciones -->
    <div class="dock-actions">
      <!-- Iconos Sociales (Desktop) -->
      <div class="social-dock desktop-only">
        <a [href]="contact.linkedin || '#'" target="_blank" rel="noopener" title="LinkedIn" (mouseenter)="playHover()" (click)="playClick()" class="dock-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"></path></svg>
        </a>
        <a [href]="contact.github || '#'" target="_blank" rel="noopener" title="GitHub" (mouseenter)="playHover()" (click)="playClick()" class="dock-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"></path></svg>
        </a>
      </div>

      <div class="divider desktop-only"></div>

      <!-- Control de Audio -->
      <button class="dock-btn-icon" (mouseenter)="playHover()" (click)="onToggleSound($event)" [title]="soundEnabled ? 'Silenciar sonido' : 'Activar sonido'">
        <svg *ngIf="soundEnabled" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
        <svg *ngIf="!soundEnabled" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
      </button>

      <!-- Botón CV / Menú Móvil -->
      <a *ngIf="cvDownload; else cvRoute" [href]="cvHref" download class="btn-primary-dock desktop-only" (mouseenter)="playHover()" (click)="playClick()">
        {{ cvLabel }}
      </a>
      <ng-template #cvRoute>
        <a [routerLink]="cvHref" class="btn-primary-dock desktop-only" (mouseenter)="playHover()" (click)="playClick()">
          {{ cvLabel }}
        </a>
      </ng-template>

      <!-- Menú full screen -->
      <button class="btn-burger" (click)="onOpenMenu($event)" (mouseenter)="playHover()" title="Abrir menú" aria-label="Abrir menú">
        <span class="burger-line"></span>
        <span class="burger-line"></span>
      </button>

    </div>
  </div>
</nav>

<!-- Medidor de scrollY flotante -->
<div class="scroll-y-meter" title="Medidor de scrollY en tiempo real">
  <span class="meter-icon">📍</span>
  <span class="meter-label">scrollY:</span>
  <span class="meter-value" [class.highlight-888]="scrollYValue === 888 || scrollYValue === 1726 || scrollYValue === 2407 || scrollYValue === 3102 || scrollYValue === 5907 || scrollYValue === 11315">{{ scrollYValue }}px</span>
</div>
