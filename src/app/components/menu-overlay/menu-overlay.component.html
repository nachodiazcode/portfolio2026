<div class="menu-overlay" [ngClass]="{'open': isOpen}">
  <!-- Glows -->
  <div style="position: absolute; top: -160px; right: -120px; width: 640px; height: 640px; background: radial-gradient(circle, rgba(var(--accent-1-rgb),.18), transparent 62%); pointer-events: none;"></div>
  <div style="position: absolute; bottom: -200px; left: -160px; width: 640px; height: 640px; background: radial-gradient(circle, rgba(var(--accent-2-rgb),.18), transparent 64%); pointer-events: none;"></div>

  <!-- Barra superior del overlay -->
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 72px; z-index: 2;">
    <div style="max-width: 1180px; margin: 0 auto; height: 100%; padding: 0 32px; display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 11px;">
        <span style="display: inline-block; padding: 2px; border-radius: 50%; background: linear-gradient(135deg,var(--accent-1),var(--accent-2));">
          <img [src]="photo" [alt]="brandName" style="display: block; width: 32px; height: 32px; border-radius: 50%; object-fit: cover; object-position: center 18%; border: 2px solid var(--bg-deep);">
        </span>
        <span style="font-weight: 700; font-size: 16px; letter-spacing: -.3px; color: #fff;">{{ brandName }}</span>
      </div>
      <button (click)="onClose($event)" (mouseenter)="playHover()" aria-label="Cerrar menú" class="btn-close">
        Cerrar
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
  </div>

  <!-- Contenido -->
  <div class="menu-content-wrapper">
    <div class="menu-grid">

      <!-- Enlaces grandes -->
      <nav class="fullscreen-nav">
        <span class="nav-title">Navegación</span>
        
        <a *ngFor="let lnk of menuLinks; let i = index" 
           [routerLink]="[]" [fragment]="lnk.fragment" 
           (click)="onLinkClick(lnk.fragment)" 
           (mouseenter)="playHover()" 
           class="menu-link stagger-item" 
           [style.transition-delay]="(isOpen ? 0.14 + i * 0.07 : 0) + 's'">
          <span class="menu-link-num">{{ lnk.num }}</span>
          {{ lnk.label }}
        </a>
      </nav>

      <!-- Panel de contacto -->
      <div class="menu-panel stagger-item" [style.transition-delay]="(isOpen ? 0.4 : 0) + 's'">
        <div>
          <div style="font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text-7); margin-bottom: 14px;">Contacto</div>
          <a [href]="'mailto:' + contact.email" (mouseenter)="playHover()" (click)="playClick()" class="contact-email">{{ contact.email }}</a>
          <div style="color: var(--text-6); font-size: 14px; font-weight: 500; margin-top: 8px;">{{ contact.location }}</div>
        </div>
        <div>
          <div style="font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text-7); margin-bottom: 14px;">Redes</div>
          <div style="display: flex; gap: 10px;">
            <a [href]="contact.linkedin || '#'" target="_blank" rel="noopener" title="LinkedIn" (mouseenter)="playHover()" (click)="playClick()" class="social-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"></path></svg>
            </a>
            <a [href]="contact.github || '#'" target="_blank" rel="noopener" title="GitHub" (mouseenter)="playHover()" (click)="playClick()" class="social-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"></path></svg>
            </a>
            <a [href]="'mailto:' + contact.email" title="Email" (mouseenter)="playHover()" (click)="playClick()" class="social-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            </a>
          </div>
        </div>
        <div class="availability-badge">
          <span class="badge-dot"></span>
          {{ badge }}
        </div>
      </div>

    </div>
  </div>
</div>
