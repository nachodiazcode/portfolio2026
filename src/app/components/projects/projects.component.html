<section id="proyectos" style="position: relative; z-index: 1; padding: 96px var(--gutter); background: var(--bg-1); border-top: 1px solid rgba(255,255,255,.06); border-bottom: 1px solid rgba(255,255,255,.06);">
  <div style="max-width: 1180px; margin: 0 auto;">

    <!-- Header -->
    <div appScrollReveal style="margin-bottom: 48px; max-width: 660px;">
      <div style="font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; background: linear-gradient(120deg,var(--accent-1),var(--accent-mid)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; margin-bottom: 16px;">{{ eyebrow }}</div>
      <h2 style="font-size: clamp(34px, 5vw, 52px); font-weight: 800; letter-spacing: -1.5px; margin: 0 0 16px; line-height: 1; color: #fff;">{{ title }}</h2>
      <p style="margin: 0; font-size: 16px; line-height: 1.6; color: var(--text-6);">{{ description }}</p>
    </div>

    <!-- Masonry estilo Pinterest -->
    <div class="pin-grid">
      <article *ngFor="let p of projects; let i = index"
               appScrollReveal
               class="pin-card"
               [style.--accent]="palette[i % palette.length].a"
               [style.--accent-2]="palette[i % palette.length].b"
               [style.--ar]="palette[i % palette.length].ar"
               [style.--d]="(i % 4) * 0.08 + 's'"
               (mouseenter)="playHover()">

        <div *ngIf="p.imageUrl" class="pin-media" (click)="openDetail(p)">
          <img [src]="p.imageUrl" [alt]="'Captura del proyecto ' + p.title" loading="lazy">
          <div class="pin-scrim"></div>
          <span class="pin-year">{{ p.year }}</span>
        </div>

        <div class="pin-body">
          <h3 class="pin-title">{{ p.title }}</h3>
          <div class="pin-tagline">{{ p.tagline }}</div>
          <p class="pin-desc">{{ p.description }}</p>
          <div class="pin-tech">
            <span *ngFor="let t of p.tech | slice:0:4" class="pin-pill">{{ t }}</span>
            <span *ngIf="p.tech.length > 4" class="pin-pill pin-pill--more">+{{ p.tech.length - 4 }}</span>
          </div>
          <button type="button" class="pin-btn" (click)="openDetail(p)">
            Ver detalle
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </button>
        </div>

      </article>
    </div>

  </div>
</section>

<!-- ===== Modal de detalle ===== -->
<div class="pin-modal" *ngIf="selected" (click)="closeDetail()">
  <div class="pin-modal-card"
       [style.--accent]="selAccent"
       [style.--accent-2]="selAccent2"
       (click)="$event.stopPropagation()">

    <button type="button" class="pin-modal-close" (click)="closeDetail()" aria-label="Cerrar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>

    <div *ngIf="selected.imageUrl" class="pin-modal-media">
      <img [src]="selected.imageUrl" [alt]="'Captura del proyecto ' + selected.title">
      <div class="pin-modal-media-scrim"></div>
      <span class="pin-year pin-year--float">{{ selected.year }}</span>
    </div>

    <div class="pin-modal-body">
      <h3 class="pin-modal-title">{{ selected.title }}</h3>
      <div class="pin-tagline">{{ selected.tagline }}</div>
      <p class="pin-modal-desc">{{ selected.description }}</p>
      <div class="pin-modal-tech-label">Construido con</div>
      <div class="pin-tech">
        <span *ngFor="let t of selected.tech" class="pin-pill">{{ t }}</span>
      </div>
    </div>

  </div>
</div>
