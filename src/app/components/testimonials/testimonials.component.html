<section id="testimonios" style="position: relative; z-index: 1; padding: 88px var(--gutter) 96px; background: var(--bg-0);">
  <div style="max-width: 1180px; margin: 0 auto;">

    <!-- Header -->
    <div appScrollReveal style="margin-bottom: 44px; max-width: 660px;">
      <div style="font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; background: linear-gradient(120deg,var(--accent-1),var(--accent-mid)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; margin-bottom: 10px;">Lo que dicen de mí</div>
      <h2 style="font-size: clamp(34px, 5vw, 52px); font-weight: 800; letter-spacing: -1.5px; margin: 0 0 10px; line-height: 1; color: #fff;">Testimonios</h2>
      <p style="margin: 0; font-size: 16px; line-height: 1.6; color: var(--text-6);">Recomendaciones reales de LinkedIn, de gente con la que trabajé codo a codo.</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px;">
      <figure *ngFor="let t of testimonials" appScrollReveal (mouseenter)="playHover()" class="testimonial-card">
        <div class="quote-mark">"</div>
        <blockquote class="testimonial-quote">{{ t.quote }}</blockquote>
        <figcaption class="testimonial-author">
          <div class="author-avatar">
            <img *ngIf="t.avatarUrl" [src]="t.avatarUrl" alt="Foto de {{ t.name }}" loading="lazy" decoding="async">
            <span *ngIf="!t.avatarUrl">{{ t.initial }}</span>
          </div>
          <div style="min-width: 0;">
            <div class="author-name">{{ t.name }}</div>
            <div class="author-role">{{ t.role }}</div>
            <div class="author-context">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"></path></svg>
              {{ t.context }}
            </div>
          </div>
        </figcaption>
      </figure>
    </div>

  </div>
</section>
