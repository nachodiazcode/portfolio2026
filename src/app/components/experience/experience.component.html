<section id="experiencia" style="position: relative; z-index: 1; padding: 96px var(--gutter) 110px;">
  <div style="max-width: 920px; margin: 0 auto;">
    
    <!-- Trayectoria Header -->
    <div appScrollReveal style="margin-bottom: 56px; max-width: 660px;">
      <div style="font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; background: linear-gradient(120deg,var(--accent-1),var(--accent-mid)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; margin-bottom: 16px;">{{ eyebrow }}</div>
      <h2 style="font-size: clamp(34px, 5vw, 52px); font-weight: 800; letter-spacing: -1.5px; margin: 0 0 16px; line-height: 1; color: #fff;">{{ title }}</h2>
      <p style="margin: 0; font-size: 16px; line-height: 1.6; color: var(--text-6);">{{ description }}</p>
    </div>

    <!-- Timeline Wrapper -->
    <div style="position: relative;">
      <!-- Timeline Line -->
      <div class="job-timeline-line"></div>

      <div style="display: flex; flex-direction: column; gap: 26px;">
        <div *ngFor="let job of jobs; let i = index" appScrollReveal class="job-row">
          <!-- Node / Letter logo -->
          <div class="job-node"
               [style.padding]="job.logoUrl ? '0' : '2px'"
               [style.background]="job.logoUrl ? 'rgba(255, 255, 255, 0.05)' : 'linear-gradient(135deg,var(--accent-1),var(--accent-2))'"
               [style.box-shadow]="job.logoUrl ? '0 0 0 5px var(--bg-0), 0 0 0 6px rgba(255, 255, 255, 0.12)' : '0 0 0 5px var(--bg-0)'">
            <div style="position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center;">
              <img *ngIf="job.logoUrl" [src]="job.logoUrl" alt="Logo de {{ job.company }}" [style.transform]="(job.logoScale || job.logoOffsetY) ? 'translateY(' + (job.logoOffsetY || 0) + '%) scale(' + (job.logoScale || 1) + ')' : 'none'" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%; transition: transform 0.3s;">
              <span *ngIf="!job.logoUrl" style="position: absolute; font-size: 21px; font-weight: 800; color: #fff; opacity: .92;">{{ job.company.charAt(0) }}</span>
            </div>
          </div>

          <!-- Job Card -->
          <article (click)="onJobClick(job)" (mouseenter)="playHover()" class="job-card">
            <div class="job-num">{{ job.num }}</div>

            <div class="job-meta">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
              {{ job.dates }} <span style="color: var(--text-8);">·</span> {{ job.duration }}
            </div>

            <h3 class="job-title">{{ job.title }}</h3>
            <div class="job-company">{{ job.company }}</div>

            <p class="job-desc">{{ job.description }}</p>

            <!-- Tech stack pills -->
            <div *ngIf="showTechStack" style="display: flex; flex-wrap: wrap; gap: 7px;">
              <span *ngFor="let t of job.tech" class="tech-pill">{{ t }}</span>
            </div>
          </article>
        </div>
      </div>

    </div>
  </div>
</section>
