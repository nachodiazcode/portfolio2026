# Blueprint de Render para la API del portafolio.
#
# Cómo usarlo:
#   Render → New → Blueprint → elige el repositorio nachodiazcode/portfolio2026.
#   Render lee este archivo y crea la base de datos y el servicio con sus
#   variables ya configuradas. Los secretos JWT los genera él mismo.
#
# Tras el primer despliegue, regístrate en el chat con el correo de OWNER_EMAIL
# para quedar como ADMIN y ver la bandeja de mensajes.

databases:
  - name: portfolio-db
    databaseName: portfolio
    user: portfolio
    plan: free

services:
  - type: web
    name: portfolio-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    branch: claude/levantar-proyecto-cfbe4a
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      # Render genera estos dos valores; no hay que copiar nada a mano.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OWNER_EMAIL
        value: ignaciosergiodiaz@gmail.com
      - key: CORS_ORIGINS
        value: https://nachodiazcode.github.io,http://localhost:4200
      - key: NODE_VERSION
        value: "20"
